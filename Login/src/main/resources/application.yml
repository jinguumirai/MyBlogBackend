server:
  port: 8082

spring:
  profiles:
    active: dev
  messages:
    basename: i18n/messages/messages
    encoding: UTF-8
    fallback-to-system-locale: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    doc-expansion: list
    enabled: false
  api-docs:
    path: /v3/api-docs
    enabled: false

# トークンCookieの既定設定(本番はHTTPSなのでSecure=true)。
# devプロファイルでは application-dev.yml で false に上書きする。
jwt:
  cookie-secure: true